<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>K-Tactics Lab 2026 — social cover</title>
<!--
  Source for docs/img/og-cover.png (1200x630 link preview card).
  Regenerate:
    chrome --headless=new --disable-gpu --virtual-time-budget=8000 \
      --window-size=1200,630 --screenshot=docs/img/og-cover.png docs/img/og-cover.html
  Text is baked as real DOM text, not an AI-generated image, so the wording
  stays exactly what the app says. Palette and fonts mirror index.css.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: radial-gradient(1100px 620px at 78% 18%, #16223a 0%, #0a1120 55%, #05070f 100%);
    font-family: 'Noto Sans KR', 'Outfit', 'Malgun Gothic', sans-serif;
    color: #eef3ff;
    display: flex; align-items: center;
    position: relative;
  }
  /* floodlight wash, same trick the board uses */
  body::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(560px 300px at 20% -10%, rgba(34, 224, 138, 0.13), transparent 70%);
  }
  .wrap { position: relative; display: flex; width: 100%; height: 100%; padding: 62px 60px; gap: 46px; }
  .left { flex: 1 1 620px; display: flex; flex-direction: column; justify-content: center; }

  .kicker {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 21px; font-weight: 700; letter-spacing: 0.02em;
    color: #ff5b74; margin-bottom: 22px;
  }
  .kicker i { width: 9px; height: 9px; border-radius: 50%; background: #ff5b74; display: block; }

  /* keep-all stops Korean from breaking inside a word, which is the default */
  h1 { font-size: 44px; line-height: 1.32; font-weight: 900; letter-spacing: -0.015em; word-break: keep-all; }
  h1 .hot { color: #ff5b74; }
  .sub { margin-top: 22px; font-size: 24px; line-height: 1.5; color: #9db0d0; font-weight: 500; word-break: keep-all; }
  .sub b { color: #eef3ff; font-weight: 700; }

  .brandline { margin-top: 52px; display: flex; align-items: center; gap: 16px; }
  .mark {
    width: 54px; height: 54px; border-radius: 15px; flex: none;
    background: linear-gradient(145deg, #22e08a, #0f9d63);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 26px rgba(34, 224, 138, 0.35);
  }
  .mark svg { width: 32px; height: 32px; }
  .brand-name { font-family: 'Outfit', sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -0.01em; }
  .brand-name span { color: #f6c945; }
  .brand-sub { font-size: 16px; color: #67789a; font-weight: 600; margin-top: 3px; letter-spacing: 0.01em; }

  /* right: the live match view, the app's own visual language */
  .right { flex: 0 0 430px; display: flex; flex-direction: column; justify-content: center; gap: 16px; }
  .scoreline {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 27px;
    background: rgba(16, 26, 44, 0.88); border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 14px; padding: 13px 0;
  }
  .scoreline .kor { color: #eef3ff; }
  .scoreline .num { font-size: 31px; }
  .scoreline .opp { color: #9db0d0; }
  .scoreline .tag {
    font-size: 15px; font-weight: 700; color: #05070f; background: #ff5b74;
    padding: 4px 10px; border-radius: 999px; margin-left: 6px;
  }
  .pitch {
    height: 300px; border-radius: 16px; position: relative; overflow: hidden;
    background:
      repeating-linear-gradient(90deg, #1a6f43 0 48px, #22824f 48px 96px);
    border: 2px solid rgba(255, 255, 255, 0.14);
    box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.5), 0 20px 50px rgba(0, 0, 0, 0.55);
  }
  .pitch svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .caption { text-align: center; font-size: 17px; color: #9db0d0; font-weight: 600; word-break: keep-all; }
  .caption b { color: #33d6ff; font-weight: 700; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="left">
      <div class="kicker"><i></i>2026 북중미 월드컵 · 조별리그 최종전</div>
      <h1>비기기만 하면 32강이었다.<br><span class="hot">그런데 남아공에 0-1</span>로 졌다.</h1>
      <div class="sub">이제 그 경기를, <b>당신이 다시 지휘한다.</b></div>
      <div class="brandline">
        <div class="mark">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="10" stroke="#05231a" stroke-width="2"/>
            <path d="M12 2v20M2 12h20" stroke="#05231a" stroke-width="1.6"/>
            <circle cx="12" cy="12" r="4" stroke="#05231a" stroke-width="1.6"/>
          </svg>
        </div>
        <div>
          <div class="brand-name">K-Tactics Lab <span>2026</span></div>
          <div class="brand-sub">AI 상대 감독 · 1,000회 몬테카를로 · 2D 라이브 중계</div>
        </div>
      </div>
    </div>

    <div class="right">
      <div class="scoreline">
        <span class="kor">KOR</span>
        <span class="num">0 : 1</span>
        <span class="opp">남아공</span>
        <span class="tag">그날의 결과</span>
      </div>
      <div class="pitch">
        <svg viewBox="0 0 430 300" preserveAspectRatio="none">
          <g stroke="rgba(255,255,255,0.5)" stroke-width="2" fill="none">
            <rect x="10" y="10" width="410" height="280" rx="2"/>
            <line x1="215" y1="10" x2="215" y2="290"/>
            <circle cx="215" cy="150" r="46"/>
            <rect x="10" y="72" width="62" height="156"/>
            <rect x="358" y="72" width="62" height="156"/>
          </g>
          <!-- our 3-4-3 attacking right, their 4-4-2 dropping off: the shapes the app draws -->
          <g fill="#ff5b74" stroke="#ffffff" stroke-width="2">
            <circle cx="34" cy="150" r="8"/>
            <circle cx="96" cy="72" r="9"/><circle cx="96" cy="150" r="9"/><circle cx="96" cy="228" r="9"/>
            <circle cx="168" cy="52" r="9"/><circle cx="168" cy="118" r="9"/><circle cx="168" cy="182" r="9"/><circle cx="168" cy="248" r="9"/>
            <circle cx="246" cy="84" r="9"/><circle cx="246" cy="150" r="9"/><circle cx="246" cy="216" r="9"/>
          </g>
          <g fill="#e6ecf7" stroke="rgba(5,7,15,0.75)" stroke-width="2">
            <circle cx="396" cy="150" r="8"/>
            <circle cx="344" cy="66" r="9"/><circle cx="344" cy="122" r="9"/><circle cx="344" cy="178" r="9"/><circle cx="344" cy="234" r="9"/>
            <circle cx="292" cy="66" r="9"/><circle cx="292" cy="122" r="9"/><circle cx="292" cy="178" r="9"/><circle cx="292" cy="234" r="9"/>
            <circle cx="268" cy="112" r="9"/><circle cx="268" cy="188" r="9"/>
          </g>
          <circle cx="228" cy="140" r="6" fill="#f6c945" stroke="rgba(5,7,15,0.9)" stroke-width="2"/>
        </svg>
      </div>
      <div class="caption">감독 대 감독 · <b>당신의 전술로 다시 지휘하는 그 90분</b></div>
    </div>
  </div>
</body>
</html>
